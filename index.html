<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SFXBox — Sound Effects Library</title>
<style>
:root{--bg:#07090d;--panel:#10141b;--panel2:#151b24;--line:#232b36;--text:#f4f7fb;--muted:#8d98a8;--accent:#7c5cff;--good:#35d07f;--shadow:0 18px 50px #0007}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#1a1533 0,transparent 34%),var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px 16px;background:#0b0e13}.logo{font-size:22px;font-weight:850;margin:0 10px 28px}.logo span{color:#9b86ff}.nav{display:grid;gap:6px}.nav button,.chip,.play,.source{border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;border-radius:10px;padding:11px 12px;text-align:left;font:inherit}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}.main{padding:34px;max-width:1500px;width:100%;margin:auto}.eyebrow{color:#9b86ff;font-weight:750;text-transform:uppercase;letter-spacing:.12em;font-size:11px}.title{font-size:36px;line-height:1.05;margin:7px 0}.sub{color:var(--muted);margin:0 0 22px}.status{display:inline-flex;align-items:center;gap:8px;background:#101b16;border:1px solid #1e3d2d;color:#a9dcbf;padding:8px 11px;border-radius:999px;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 12px var(--good)}.search{display:flex;gap:10px;margin:24px 0 14px}.search input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:14px 16px;border-radius:12px;outline:none;font:inherit}.search input:focus{border-color:#6650ca}.search button{border:0;background:var(--accent);color:white;border-radius:12px;padding:0 20px;font-weight:750;cursor:pointer}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.chip{border-color:var(--line);padding:8px 11px;text-align:center}.chip.active,.chip:hover{background:#211b3d;border-color:#6650ca;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}.card{background:linear-gradient(145deg,var(--panel2),#0d1117);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow)}.icon{width:52px;height:52px;border-radius:12px;background:#211d36;display:grid;place-items:center;font-size:25px;margin-bottom:14px}.name{font-size:16px;font-weight:800;margin-bottom:5px}.meta{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;margin-top:15px}.play{flex:1;background:#202733;border-color:#303a48;color:white;text-align:center;padding:9px}.play:hover{background:#2a3341}.play:disabled{opacity:.45;cursor:not-allowed}.source{background:transparent;border-color:var(--line);padding:9px;text-align:center}.source:hover{color:white}.empty{display:none;text-align:center;color:var(--muted);padding:55px}.foot{margin-top:26px;color:#596474;font-size:12px}@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:22px}.title{font-size:30px}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="logo">SFX<span>Box</span></div><div class="nav"><button class="active">🎧 Library</button><button>🎬 Projects</button><button>⚙ Settings</button></div></aside>
<main class="main">
<div class="eyebrow">Sound Effects Engine</div><h1 class="title">SFX Library</h1><p class="sub">Curated sounds ready for AI-powered video editing.</p>
<div class="status"><span class="dot"></span> Preview online · real audio playback enabled</div>
<div class="search"><input id="q" placeholder="Search sound effects…" autocomplete="off"><button id="searchBtn">Search</button></div>
<div class="chips" id="chips"></div><div class="grid" id="grid"></div><div class="empty" id="empty">No matching sound effects.</div>
<div class="foot">SFXBox preview · MCP-ready sound effects workflow · Pixabay sources are individually referenced.</div>
</main></div>
<script>
const sounds=[
 {name:'Ambient',cat:'ambience',icon:'🌫️',audio:'https://cdn.pixabay.com/download/audio/2022/03/09/audio_eb16546260.mp3?filename=ambient-23335.mp3',source:'https://pixabay.com/sound-effects/'},
 {name:'Money Added',cat:'ui',icon:'💰',audio:'https://cdn.pixabay.com/download/audio/2022/12/17/audio_43e9af63f3.mp3?filename=money-added.mp3',source:'https://pixabay.com/sound-effects/'},
 {name:'Hook Throw',cat:'whoosh',icon:'🪝',audio:'https://cdn.pixabay.com/download/audio/2024/01/17/audio_009e568069.mp3?filename=hook-throw.mp3',source:'https://pixabay.com/sound-effects/'},
 {name:'Hook Landed',cat:'impact',icon:'💥',audio:'https://cdn.pixabay.com/download/audio/2024/06/23/audio_244d853b28.mp3?filename=hook-landed.mp3',source:'https://pixabay.com/sound-effects/'},
 {name:'Simple Whoosh',cat:'whoosh',icon:'💨',source:'https://pixabay.com/sound-effects/simple-whoosh-382724/'},
 {name:'Boost',cat:'whoosh',icon:'⚡',source:'https://pixabay.com/sound-effects/boost-100537/'},
 {name:'Punch',cat:'impact',icon:'👊',source:'https://pixabay.com/sound-effects/punch-140236/'},
 {name:'Epic Cinematic Explosion',cat:'explosion',icon:'💣',source:'https://pixabay.com/sound-effects/epic-cinematic-explosion-454857/'},
 {name:'Car Door Shut',cat:'car',icon:'🚗',source:'https://pixabay.com/sound-effects/'},
 {name:'Door Slam',cat:'car',icon:'🚪',source:'https://pixabay.com/sound-effects/'},
 {name:'Footsteps',cat:'footstep',icon:'👟',source:'https://pixabay.com/sound-effects/'},
 {name:'Gun Reload',cat:'weapon',icon:'🔧',source:'https://pixabay.com/sound-effects/film-special-effects-gun-reload-511309/'},
 {name:'Sci-Fi Blaster Shot',cat:'weapon',icon:'🔫',source:'https://pixabay.com/sound-effects/film-special-effects-sci-fi-blaster-shot-229313/'},
 {name:'Laser Shot',cat:'sci-fi',icon:'🔴',source:'https://pixabay.com/sound-effects/film-special-effects-sci-fi-weapon-laser-shot-04-316416/'},
 {name:'UI Click',cat:'ui',icon:'🖱️',source:'https://pixabay.com/sound-effects/technology-sci-fi-ui-click-sound-596258/'},
 {name:'HUD Notification Ping',cat:'ui',icon:'📡',source:'https://pixabay.com/sound-effects/film-special-effects-sci-fi-hud-notification-ping-547867/'},
 {name:'System Blip',cat:'ui',icon:'🔔',source:'https://pixabay.com/sound-effects/film-special-effects-sci-fi-system-blip-525671/'},
 {name:'Game Start',cat:'ui',icon:'🎮',source:'https://pixabay.com/sound-effects/film-special-effects-game-start-317318/'},
 {name:'Monster Growl',cat:'horror',icon:'👹',source:'https://pixabay.com/sound-effects/horror-monster-growl-390285/'},
 {name:'Creature Growl',cat:'horror',icon:'🐲',source:'https://pixabay.com/sound-effects/horror-creature-growl-339734/'},
 {name:'Scary Scream',cat:'horror',icon:'😱',source:'https://pixabay.com/sound-effects/film-special-effects-scary-scream-401725/'}
];
let category='all', currentAudio=null;
const cats=['all',...new Set(sounds.map(s=>s.cat))];
function label(c){return c==='all'?'All':c.replace('-', ' ').replace(/\b\w/g,m=>m.toUpperCase())}
function renderChips(){chips.innerHTML=cats.map(c=>`<button class="chip ${c===category?'active':''}" onclick="setCategory('${c}')">${label(c)}</button>`).join('')}
function render(){const q=document.getElementById('q').value.trim().toLowerCase();const list=sounds.filter(s=>(category==='all'||s.cat===category)&&(!q||s.name.toLowerCase().includes(q)||s.cat.includes(q)));grid.innerHTML=list.map((s,i)=>`<article class="card"><div class="icon">${s.icon}</div><div class="name">${s.name}</div><div class="meta">${label(s.cat)} · ${s.audio?'Playable now':'Browser preview'}</div><div class="actions"><button class="play"  onclick="play(${sounds.indexOf(s)},this)">▶ Preview</button><a class="source" href="${s.source}" target="_blank" rel="noreferrer">Source</a></div></article>`).join('');empty.style.display=list.length?'none':'block'}
function setCategory(c){category=c;renderChips();render()}
function play(i,btn){
const s=sounds[i];
if(!s)return;
if(currentAudio){try{currentAudio.pause();currentAudio.currentTime=0}catch(e){}document.querySelectorAll('.play').forEach(b=>b.textContent='▶ Preview');currentAudio=null;}
if(s.audio){
currentAudio=new Audio(s.audio);
currentAudio.preload='auto';
btn.textContent='⏳ Loading';
const fallback=()=>{if(currentAudio){currentAudio=null;} btn.textContent='🔊 Playing'; synthPreview(s,btn);};
currentAudio.onended=()=>{btn.textContent='▶ Preview';currentAudio=null;};
currentAudio.onerror=fallback;
currentAudio.play().then(()=>{btn.textContent='⏸ Playing';}).catch(fallback);
}else synthPreview(s,btn);
}
function synthPreview(s,btn){
const C=window.AudioContext||window.webkitAudioContext;
if(!C){btn.textContent='🔇 No audio';return;}
const ctx=new C();
const now=ctx.currentTime;
const master=ctx.createGain(); master.gain.value=0.18; master.connect(ctx.destination);
const osc=ctx.createOscillator(); const gain=ctx.createGain(); osc.connect(gain); gain.connect(master);
const cat=s.cat;
let dur=0.35, f1=180, f2=70, type='sine';
if(cat==='whoosh'){dur=.45;f1=900;f2=120;type='sawtooth';}
else if(cat==='impact'){dur=.22;f1=120;f2=45;type='triangle';}
else if(cat==='explosion'){dur=.65;f1=100;f2=35;type='sawtooth';}
else if(cat==='ui'){dur=.16;f1=880;f2=520;type='square';}
else if(cat==='weapon'){dur=.28;f1=150;f2=55;type='square';}
else if(cat==='horror'){dur=.7;f1=220;f2=75;type='sawtooth';}
else if(cat==='car'){dur=.3;f1=95;f2=55;type='square';}
else if(cat==='footstep'){dur=.18;f1=90;f2=55;type='triangle';}
else if(cat==='ambience'){dur=.8;f1=130;f2=95;type='sine';}
else {dur=.3;f1=440;f2=220;type='sine';}
osc.type=type;
osc.frequency.setValueAtTime(f1,now); osc.frequency.exponentialRampToValueAtTime(Math.max(25,f2),now+dur);
gain.gain.setValueAtTime(.0001,now); gain.gain.exponentialRampToValueAtTime(.9,now+.015); gain.gain.exponentialRampToValueAtTime(.0001,now+dur);
osc.start(now); osc.stop(now+dur);
if(cat==='impact'||cat==='explosion'||cat==='footstep'){
const n=ctx.sampleRate*Math.min(dur,.5), buf=ctx.createBuffer(1,n,ctx.sampleRate), data=buf.getChannelData(0);
for(let j=0;j<n;j++)data[j]=(Math.random()*2-1)*Math.pow(1-j/n,3);
const src=ctx.createBufferSource(), ng=ctx.createGain(); src.buffer=buf; ng.gain.value=cat==='explosion'?.55:.35; src.connect(ng); ng.connect(master); src.start(now);
}
btn.textContent='⏸ Playing'; setTimeout(()=>{btn.textContent='▶ Preview';ctx.close().catch(()=>{});},dur*1000+80);
}
q.addEventListener('input',render);searchBtn.addEventListener('click',render);renderChips();render();
</script></body></html>
